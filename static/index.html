<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Remote Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-family: sans-serif; }
    #status { background: #1a1a2e; color: #00ff88; font-family: monospace; font-size: 12px; padding: 6px 12px; text-align: center; }
    #canvas-container { flex: 0 1 auto; overflow: auto; position: relative; }
    canvas { display: block; cursor: crosshair; touch-action: none; }

    /* Control panel fills the empty space between the screen and the toolbar. */
    #controls {
      flex: 1 1 auto; min-height: 150px; background: #0d0d1a;
      display: flex; align-items: center; justify-content: space-around;
      padding: 12px; gap: 12px;
    }

    /* Directional D-pad */
    #dpad {
      display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px);
      gap: 6px; flex: 0 0 auto; touch-action: none;
    }
    .dbtn {
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 35% 35%, #16213e, #0f1830);
      border: 2px solid #0f3460; border-radius: 10px; color: #00ff88;
      font-size: 20px; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    .dbtn:active, .dbtn.held { background: #00ff88; color: #002; }
    #d-up    { grid-column: 2; grid-row: 1; }
    #d-left  { grid-column: 1; grid-row: 2; }
    #d-right { grid-column: 3; grid-row: 2; }
    #d-down  { grid-column: 2; grid-row: 3; }
    #joy-label, #scroll-label { color: #557; font-size: 11px; text-align: center; margin-top: 4px; }

    /* Vertical scroll strip */
    #scroll-wrap { display: flex; flex-direction: column; align-items: center; flex: 0 0 auto; }
    #scroll-strip {
      position: relative; width: 46px; height: 130px; border-radius: 23px;
      background: #16213e; border: 2px solid #0f3460; touch-action: none;
    }
    #scroll-thumb {
      position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
      margin: -20px 0 0 -20px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #4aa3ff, #1667c0);
      box-shadow: 0 2px 8px rgba(0,0,0,0.6); transition: transform 0.05s;
    }
    #click-col { display: flex; flex-direction: column; gap: 10px; flex: 0 0 auto; }
    #click-col button { min-width: 90px; }

    #toolbar { background: #1a1a2e; padding: 8px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button { background: #16213e; color: #fff; border: 1px solid #0f3460; padding: 8px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    button:active { background: #0f3460; }
    #keyboard-input { position: fixed; bottom: -100px; left: 0; opacity: 0; width: 1px; height: 1px; }
    #quality-slider { width: 100px; accent-color: #00ff88; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .connected { background: #00ff88; }
    .disconnected { background: #ff4444; }

    #auth-overlay {
      position: fixed; inset: 0; background: #0d0d1a; z-index: 10;
      display: flex; align-items: center; justify-content: center;
    }
    #auth-box { background: #1a1a2e; padding: 24px; border-radius: 10px; width: 280px; text-align: center; }
    #auth-box h2 { color: #00ff88; font-size: 16px; margin-bottom: 14px; }
    #auth-box input {
      width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #0f3460;
      background: #16213e; color: #fff; margin-bottom: 10px; font-size: 14px;
    }
    #auth-box button { width: 100%; background: #00ff88; color: #000; font-weight: bold; }
    #auth-error { color: #ff4444; font-size: 12px; min-height: 16px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="auth-overlay">
    <div id="auth-box">
      <h2>Enter Access Token</h2>
      <input type="password" id="token-input" placeholder="Access token" autocomplete="off">
      <button onclick="submitToken()">Connect</button>
      <div id="auth-error"></div>
    </div>
  </div>

  <div id="status">
    <span class="status-dot disconnected" id="dot"></span>
    <span id="status-text">Waiting for token...</span>
    <span id="input-debug" style="color:#ffb347;margin-left:10px;"></span>
  </div>
  <div id="canvas-container">
    <canvas id="screen"></canvas>
  </div>

  <div id="controls">
    <div>
      <div id="dpad">
        <div class="dbtn" id="d-up"    data-dx="0"  data-dy="-1">▲</div>
        <div class="dbtn" id="d-left"  data-dx="-1" data-dy="0">◀</div>
        <div class="dbtn" id="d-right" data-dx="1"  data-dy="0">▶</div>
        <div class="dbtn" id="d-down"  data-dx="0"  data-dy="1">▼</div>
      </div>
      <div id="joy-label">move</div>
    </div>

    <div id="click-col">
      <button id="btn-left">Left Click</button>
      <button id="btn-right">Right Click</button>
    </div>

    <div id="scroll-wrap">
      <div id="scroll-strip"><div id="scroll-thumb"></div></div>
      <div id="scroll-label">scroll</div>
    </div>
  </div>

  <div id="toolbar">
    <button onclick="toggleKeyboard()">Keyboard</button>
    <button onclick="sendKey('ctrl+alt+delete')">Ctrl+Alt+Del</button>
    <button onclick="sendKey('alt+tab')">Alt+Tab</button>
    <label style="color:#aaa;font-size:12px;display:flex;align-items:center;gap:6px;">
      Quality <input type="range" id="quality-slider" min="10" max="90" value="50">
    </label>
  </div>
  <input type="text" id="keyboard-input" autocomplete="off">

  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');
    const dot = document.getElementById('dot');
    const container = document.getElementById('canvas-container');
    const authOverlay = document.getElementById('auth-overlay');
    const authError = document.getElementById('auth-error');

    let ws, reconnectTimer, token = null;
    let scaleX = 1, scaleY = 1;
    let lastTouchX = 0, lastTouchY = 0;
    let touchStartTime = 0;

    // Virtual cursor position, in streamed-image pixel space (same space the
    // agent maps back to real screen coords). Driven by the joystick and by
    // direct taps on the screen; used as the target for the click buttons.
    let vx = 0, vy = 0, cursorReady = false;

    // Allow passing ?token=xxx in the URL so you can bookmark a direct link.
    const urlToken = new URLSearchParams(location.search).get('token');
    if (urlToken) {
      token = urlToken;
      authOverlay.style.display = 'none';
      connect();
    }

    function submitToken() {
      const val = document.getElementById('token-input').value.trim();
      if (!val) { authError.textContent = 'Enter a token'; return; }
      token = val;
      authOverlay.style.display = 'none';
      connect();
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/browser?token=${encodeURIComponent(token)}`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        statusText.textContent = 'Connected — Live';
        dot.className = 'status-dot connected';
        clearTimeout(reconnectTimer);
      };

      ws.onclose = (e) => {
        if (e.code === 4401) {
          statusText.textContent = 'Invalid token';
          authOverlay.style.display = 'flex';
          authError.textContent = 'Invalid token, try again';
          return;
        }
        statusText.textContent = 'Disconnected — Reconnecting...';
        dot.className = 'status-dot disconnected';
        reconnectTimer = setTimeout(connect, 3000);
      };

      ws.onerror = () => ws.close();

      // Keep only the newest frame. If frames arrive faster than we can
      // decode/draw (slow network catching up), we skip the stale ones instead
      // of queueing them — this keeps latency from snowballing.
      ws.onmessage = (e) => {
        pendingFrame = e.data;
        if (!decoding) decodeLoop();
      };
    }

    function fitCanvas(imgW, imgH) {
      if (canvas.width === imgW && canvas.height === imgH) return;
      canvas.width = imgW;
      canvas.height = imgH;
      const w = container.clientWidth;
      const scale = w / imgW;
      canvas.style.width = w + 'px';
      canvas.style.height = (imgH * scale) + 'px';
      scaleX = imgW / w;
      scaleY = imgH / (imgH * scale);
      if (!cursorReady) {           // start the virtual cursor at the center
        vx = imgW / 2; vy = imgH / 2; cursorReady = true;
      }
    }

    function drawCursor() {
      if (!cursorReady) return;
      ctx.save();
      ctx.strokeStyle = '#00ff88';
      ctx.lineWidth = Math.max(1, canvas.width / 1200);
      const r = Math.max(4, canvas.width / 240);
      ctx.beginPath();
      ctx.arc(vx, vy, r, 0, Math.PI * 2);
      ctx.moveTo(vx - r * 1.6, vy); ctx.lineTo(vx + r * 1.6, vy);
      ctx.moveTo(vx, vy - r * 1.6); ctx.lineTo(vx, vy + r * 1.6);
      ctx.stroke();
      ctx.restore();
    }

    let pendingFrame = null, decoding = false;

    async function decodeLoop() {
      decoding = true;
      try {
        while (pendingFrame) {
          const data = pendingFrame;
          pendingFrame = null;   // grab latest; anything newer replaces it
          try {
            const bitmap = await createImageBitmap(new Blob([data], { type: 'image/jpeg' }));
            fitCanvas(bitmap.width, bitmap.height);
            ctx.drawImage(bitmap, 0, 0);
            drawCursor();          // overlay where the virtual cursor is
            bitmap.close();
          } catch (_) { /* drop undecodable frame */ }
        }
      } finally {
        decoding = false;
      }
    }

    const inputDebug = document.getElementById('input-debug');
    let sentCount = 0;

    function send(obj) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(obj));
        sentCount++;
        // Show what we actually sent, so control problems are visible on-device.
        if (obj.x !== undefined)
          inputDebug.textContent = `${obj.type} @${Math.round(obj.x)},${Math.round(obj.y)} (#${sentCount})`;
        else
          inputDebug.textContent = `${obj.type} (#${sentCount})`;
      } else {
        inputDebug.textContent = 'NOT SENT — socket closed';
      }
    }

    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      send({ type: 'mousemove', x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY });
    });
    canvas.addEventListener('mousedown', e => {
      const r = canvas.getBoundingClientRect();
      send({ type: 'mousedown', button: e.button, x: (e.clientX - r.left) * scaleX, y: (e.clientY - r.top) * scaleY });
    });
    canvas.addEventListener('mouseup', e => {
      send({ type: 'mouseup', button: e.button });
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      const r = canvas.getBoundingClientRect();
      lastTouchX = vx = (t.clientX - r.left) * scaleX;
      lastTouchY = vy = (t.clientY - r.top) * scaleY;
      touchStartTime = Date.now();
      send({ type: 'mousemove', x: lastTouchX, y: lastTouchY });
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      const duration = Date.now() - touchStartTime;
      if (duration < 300) {
        send({ type: 'mousedown', button: 0, x: lastTouchX, y: lastTouchY });
        setTimeout(() => send({ type: 'mouseup', button: 0 }), 100);
      } else {
        send({ type: 'mousedown', button: 2, x: lastTouchX, y: lastTouchY });
        setTimeout(() => send({ type: 'mouseup', button: 2 }), 100);
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      const r = canvas.getBoundingClientRect();
      lastTouchX = vx = (t.clientX - r.left) * scaleX;
      lastTouchY = vy = (t.clientY - r.top) * scaleY;
      send({ type: 'mousemove', x: lastTouchX, y: lastTouchY });
    }, { passive: false });

    function toggleKeyboard() {
      const inp = document.getElementById('keyboard-input');
      inp.style.bottom = inp.style.bottom === '0px' ? '-100px' : '0px';
      inp.focus();
    }

    document.getElementById('keyboard-input').addEventListener('keydown', e => {
      e.preventDefault();
      send({ type: 'keydown', key: e.key });
    });

    document.getElementById('keyboard-input').addEventListener('input', e => {
      if (e.data) send({ type: 'keypress', key: e.data });
      e.target.value = '';
    });

    function sendKey(combo) {
      send({ type: 'hotkey', combo });
    }

    // ---- Click buttons: click at the current virtual cursor position --------
    function clickAt(button) {
      send({ type: 'mousemove', x: vx, y: vy });
      send({ type: 'mousedown', button, x: vx, y: vy });
      setTimeout(() => send({ type: 'mouseup', button }), 80);
    }
    document.getElementById('btn-left').addEventListener('click', () => clickAt(0));
    document.getElementById('btn-right').addEventListener('click', () => clickAt(2));

    // ---- D-pad: tap to nudge a little, hold to creep steadily ---------------
    const DPAD_STEP = 4;        // pixels moved per step (a single tap = one step)
    const DPAD_INTERVAL = 60;   // ms between steps while a button is held
    let dirX = 0, dirY = 0;     // current held direction (-1, 0, 1)

    function nudge() {
      if (!cursorReady || (!dirX && !dirY)) return;
      vx = Math.max(0, Math.min(canvas.width, vx + dirX * DPAD_STEP));
      vy = Math.max(0, Math.min(canvas.height, vy + dirY * DPAD_STEP));
      send({ type: 'mousemove', x: vx, y: vy });
    }

    document.querySelectorAll('.dbtn').forEach(btn => {
      const dx = parseInt(btn.dataset.dx, 10);
      const dy = parseInt(btn.dataset.dy, 10);
      const press = e => {
        e.preventDefault();
        dirX = dx; dirY = dy; btn.classList.add('held');
        try { btn.setPointerCapture(e.pointerId); } catch (_) {}
        nudge();   // immediate step so a quick tap moves a little
      };
      const release = () => {
        if (dirX === dx && dirY === dy) { dirX = 0; dirY = 0; }
        btn.classList.remove('held');
      };
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointercancel', release);
      btn.addEventListener('pointerleave', release);
    });

    // While a direction stays held, keep stepping slowly.
    setInterval(nudge, DPAD_INTERVAL);

    // ---- Scroll strip: drag up/down to scroll; springs back to center -------
    const scrollStrip = document.getElementById('scroll-strip');
    const scrollThumb = document.getElementById('scroll-thumb');
    const SCROLL_RADIUS = 45;   // max thumb travel from center (px)
    let scrollActive = false, scrollAmt = 0;

    function scrollMove(clientY) {
      const r = scrollStrip.getBoundingClientRect();
      let dy = clientY - (r.top + r.height / 2);
      dy = Math.max(-SCROLL_RADIUS, Math.min(SCROLL_RADIUS, dy));
      scrollThumb.style.transform = `translateY(${dy}px)`;
      scrollAmt = dy / SCROLL_RADIUS;   // -1 (up) .. 1 (down)
    }
    function scrollReset() {
      scrollActive = false; scrollAmt = 0;
      scrollThumb.style.transform = 'translateY(0)';
    }
    scrollStrip.addEventListener('pointerdown', e => {
      e.preventDefault(); scrollActive = true;
      scrollStrip.setPointerCapture(e.pointerId); scrollMove(e.clientY);
    });
    scrollStrip.addEventListener('pointermove', e => { if (scrollActive) scrollMove(e.clientY); });
    scrollStrip.addEventListener('pointerup', scrollReset);
    scrollStrip.addEventListener('pointercancel', scrollReset);

    // Emit scroll steps at a steady cadence while the thumb is held off-center.
    setInterval(() => {
      if (scrollActive && Math.abs(scrollAmt) > 0.15) {
        // Up (negative dy) scrolls up, down scrolls down. Magnitude = speed.
        const step = Math.round(scrollAmt * 3);
        if (step !== 0) send({ type: 'scroll', x: vx, y: vy, dy: step });
      }
    }, 90);

    // Live quality control — tells the agent to change JPEG quality on the fly.
    const qualitySlider = document.getElementById('quality-slider');
    qualitySlider.addEventListener('change', () => {
      send({ type: 'quality', value: parseInt(qualitySlider.value, 10) });
    });
  </script>
</body>
</html>
